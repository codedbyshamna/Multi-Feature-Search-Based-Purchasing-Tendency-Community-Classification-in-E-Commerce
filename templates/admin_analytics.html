<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Analytics</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#e6b8b2,#f3d0cc);
display:flex;
min-height:100vh;
color:#0b1a4a;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#153e88;
padding:30px 20px;
color:white;
}

.sidebar h2{
margin-bottom:40px;
}

.sidebar-links{
display:flex;
flex-direction:column;
gap:15px;
}

.side-link{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
color:white;
padding:12px 16px;
border-radius:25px;
background:rgba(255,255,255,0.15);
border:1px solid rgba(255,255,255,0.25);
transition:.3s;
}

.side-link:hover{
background:white;
color:#153e88;
transform:translateX(5px);
}


/* MAIN */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{
background:white;
padding:20px 40px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* CONTENT */

.content{
padding:40px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:20px;
}

/* CARD */

.card{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card i{
margin-bottom:10px;
}

/* CHART SECTION */

.chart-section{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
margin-top:35px;
}

/* CHART GRID */

.chart-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

/* RESPONSIVE */

@media(max-width:1000px){

.sidebar{
display:none;
}

.grid{
grid-template-columns:repeat(2,1fr);
}

.chart-grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>


<!-- SIDEBAR -->

<div class="sidebar">

<h2>
<i class="fa fa-user-shield"></i> Admin Panel
</h2>

<div class="sidebar-links">

<a href="/admin_dashboard" class="side-link">
<i class="fa fa-home"></i> Dashboard
</a>

<a href="/admin_analytics" class="side-link">
<i class="fa fa-chart-line"></i> Analytics
</a>

<a href="/logout" class="side-link">
<i class="fa fa-sign-out-alt"></i> Logout
</a>

</div>

</div>


<!-- MAIN -->

<div class="main">

<div class="topbar">

<h3>
<i class="fa fa-chart-line"></i>
Purchasing Tendency Analytics
</h3>

<p style="color:#666">
Product demand trends based on views, carts and purchases.
</p>

</div>


<div class="content">


<!-- PRODUCT SCORE CARDS -->

<div class="grid">

{% for p in products %}

<div class="card">

<i class="fa fa-box fa-2x" style="color:#3498db"></i>

<h5>{{p.name}}</h5>

<p style="color:#777">
Interaction Score
</p>

<h3 style="color:#27ae60">
{{p.score}}
</h3>

</div>

{% endfor %}

</div>



<!-- ANALYTICS CHARTS -->

<div class="chart-section">

<h4>
<i class="fa fa-chart-bar"></i>
Product Interaction Overview
</h4>

<div class="chart-grid">

<div>

<canvas id="interactionChart"></canvas>

</div>

<div>

<canvas id="pieChart"></canvas>

</div>

</div>

</div>


</div>

</div>



<script>

var labels = {{ products | map(attribute='name') | list | tojson }};
var scores = {{ products | map(attribute='score') | list | tojson }};


/* BAR CHART */

new Chart(document.getElementById("interactionChart"),{

type:"bar",

data:{
labels:labels,
datasets:[{
label:"Interaction Score",
data:scores,
backgroundColor:"#3498db"
}]
},

options:{
responsive:true,
scales:{
y:{beginAtZero:true}
}
}

});


/* PIE CHART */

new Chart(document.getElementById("pieChart"),{

type:"pie",

data:{
labels:labels,
datasets:[{
data:scores,
backgroundColor:[
"#3498db",
"#2ecc71",
"#e74c3c",
"#f1c40f",
"#9b59b6",
"#1abc9c"
]
}]
},

options:{
responsive:true
}

});

</script>

</body>
</html>
